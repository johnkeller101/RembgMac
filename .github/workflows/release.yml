name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild -project RembgMac.xcodeproj \
            -scheme RembgMac \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          APP_PATH="build/Build/Products/Release/RembgMac.app"
          cd "$(dirname "$APP_PATH")"
          zip -r -y RembgMac.zip RembgMac.app
          mv RembgMac.zip "$GITHUB_WORKSPACE/"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: RembgMac.zip
          generate_release_notes: true
